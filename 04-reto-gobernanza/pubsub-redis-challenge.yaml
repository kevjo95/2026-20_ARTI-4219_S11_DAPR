apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: order-pubsub
  namespace: default
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis-master.redis.svc.cluster.local:6379"

    - name: redisPassword
      value: ""

    - name: ttlInSeconds
      value: "120"
      
    - name: consumerID
      value: "order-subscriber-{namespace}"
